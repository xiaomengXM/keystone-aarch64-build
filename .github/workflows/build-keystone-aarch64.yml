name: Build keystone aarch64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # 直接在 arm64 runner 上原生构建。原来的 docker+qemu 方案要 30 分钟且容易超时/被取消。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-dev python3-pip python3-venv git

      - name: Checkout keystone source
        uses: actions/checkout@v4
        with:
          repository: keystone-engine/keystone
          ref: master
          submodules: recursive
          path: keystone

      - name: Build keystone (native arm64)
        run: |
          mkdir -p out
          cd keystone
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_LIBS_ONLY=1 \
                -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86;Mips" \
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/out/keystone-dist" ..
          make -j$(nproc)
          make install
          echo "== dist =="
          find "${{ github.workspace }}/out/keystone-dist" -maxdepth 2 -type f | head -20

      - name: Build python wheel
        run: |
          cd keystone/bindings/python
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install -q --upgrade pip wheel setuptools
          # 必须显式指定 plat-name：默认会打成 manylinux1_aarch64，而 manylinux1 对 aarch64 不合法，
          # 新版 pip 会报 "is not a supported wheel on this platform"
          python3 setup.py bdist_wheel --plat-name manylinux2014_aarch64
          cp dist/*.whl "${{ github.workspace }}/out/" || true
          ls -lh "${{ github.workspace }}/out/"

      - name: Verify wheel (assemble ARM64 / X86 / ARM)
        run: |
          . /tmp/venv/bin/activate
          pip install -q "${{ github.workspace }}"/out/*.whl
          python3 -c "import keystone as ks; a=ks.Ks(ks.KS_ARCH_ARM64, ks.KS_MODE_LITTLE_ENDIAN); e=bytes(a.asm('nop')[0]).hex(); assert e=='1f2003d5', e; x=ks.Ks(ks.KS_ARCH_X86, ks.KS_MODE_64); assert bytes(x.asm('ret')[0]).hex()=='c3'; r=ks.Ks(ks.KS_ARCH_ARM, ks.KS_MODE_ARM); assert bytes(r.asm('add r0, r1, r2')[0]).hex()=='020081e0'; print('keystone', ks.__version__, 'OK arm64 nop =', e)"
          # 再验一遍"直接解包 + PYTHONPATH"路径，避免 pip 的 wheel tag 检查掩盖内容问题
          rm -rf /tmp/kx && mkdir -p /tmp/kx
          python3 -m zipfile -e "${{ github.workspace }}"/out/*.whl /tmp/kx
          PYTHONPATH=/tmp/kx python3 -c "import keystone as ks; print('unpacked import OK', ks.__version__)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: keystone-aarch64-dist
          path: out/keystone-dist
          if-no-files-found: warn
          retention-days: 90

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: keystone-aarch64-wheel
          path: out/*.whl
          if-no-files-found: warn
          retention-days: 90
