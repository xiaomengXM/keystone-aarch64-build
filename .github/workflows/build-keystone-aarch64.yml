name: Build keystone aarch64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keystone source
        uses: actions/checkout@v4
        with:
          repository: keystone-engine/keystone
          ref: master
          submodules: recursive
          path: keystone

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside arm64 ubuntu container
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/keystone":/src \
            -v "${{ github.workspace }}/out":/out \
            ubuntu:24.04 bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential cmake python3 python3-pip python3-dev git
              pip3 install --break-system-packages wheel setuptools
              cd /src
              mkdir -p build && cd build
              cmake -DCMAKE_BUILD_TYPE=Release \
                    -DBUILD_LIBS_ONLY=1 \
                    -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86;Mips" \
                    -DCMAKE_INSTALL_PREFIX=/out/keystone-dist ..
              make -j4
              make install
              cd /src/bindings/python
              python3 setup.py bdist_wheel
              cp dist/*.whl /out/ || true
              echo BUILD_OK
              ls -lh /out
            '

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: keystone-aarch64-dist
          path: out/keystone-dist
          if-no-files-found: warn

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: keystone-aarch64-wheel
          path: out/*.whl
          if-no-files-found: warn
